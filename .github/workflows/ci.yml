name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Runner labels and architectures are recorded in Documentation/Architecture.md
    # after the first run; do not assume the architecture from the label.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Matches the development machine: macOS 27.0.1, Xcode 27.2, arm64.
          - os: xcode-27
            xcode: "27.2"
          # Newest Intel image available; there is no macOS 27 Intel runner.
          - os: macos-26-intel
            xcode: "26.6"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Record environment
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
      - name: Debug build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors -Xcc -Werror
      - name: Test
        run: swift test --enable-code-coverage
      - name: Release build (warnings are errors)
        run: swift build -c release -Xswiftc -warnings-as-errors -Xcc -Werror
      - name: Archive coverage
        if: always()
        run: |
          mkdir -p artifacts
          swift test --show-codecov-path > artifacts/codecov-path.txt || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: artifacts
